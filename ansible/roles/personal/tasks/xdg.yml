---
# roles/personal/tasks/xdg.yml
# Create XDG base directories so nothing else has to.

- name: "XDG | Create base directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ xdg_config_home }}"
    - "{{ xdg_data_home }}"
    - "{{ xdg_cache_home }}"
    - "{{ xdg_state_home }}"
    - "{{ xdg_state_home }}/zsh"
    - "{{ xdg_cache_home }}/zsh"
    - "{{ xdg_config_home }}/git"
    - "{{ ansible_env.HOME }}/.local/bin"
    - "{{ ansible_env.HOME }}/.vim/undo"
    - "{{ ansible_env.HOME }}/.vim/spell"
