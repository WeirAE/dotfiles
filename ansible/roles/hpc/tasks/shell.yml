---
# roles/hpc/tasks/shell.yml
# Deploy bash dotfiles. Does NOT attempt to change the login shell
# (requires sysadmin action on most HPC systems).

- name: "Shell | Deploy .bashrc"
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_dir }}/hpc/bash/.bashrc"
    dest: "{{ ansible_env.HOME }}/.bashrc"
    backup: true
    mode: "0644"

- name: "Shell | Deploy .bash_profile"
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_dir }}/hpc/bash/.bash_profile"
    dest: "{{ ansible_env.HOME }}/.bash_profile"
    backup: true
    mode: "0644"

- name: "Shell | Note: changing login shell requires sysadmin"
  ansible.builtin.debug:
    msg: >
      If your login shell is not bash, ask your sysadmin to run:
        chsh -s /bin/bash {{ ansible_env.USER }}
      Or add 'exec bash --login' to ~/.profile as a workaround.
  when: ansible_user_shell is defined and ansible_user_shell != '/bin/bash'
