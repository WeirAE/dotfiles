all:
  children:

    personal:
      hosts:
        localhost:
          ansible_connection: local
          ansible_user: "{{ lookup('env', 'USER') }}"
      vars:
        dotfiles_profile: personal

    hpc:
      hosts:
        # Replace with your cluster login node hostname or IP
        hpc-login1:
          ansible_user: "{{ lookup('env', 'HPC_USER') | default(lookup('env', 'USER')) }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_hpc"
          # Most HPC login nodes do NOT allow password sudo; skip privilege escalation
          ansible_become: false
      vars:
        dotfiles_profile: hpc

    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_user: "{{ lookup('env', 'USER') }}"
